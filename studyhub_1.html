<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 20c8-4 16-4 24 0v28c-8-4-16-4-24 0V20z' fill='%23fff' stroke='%2314171A' stroke-width='3'/%3E%3Cpath d='M56 20c-8-4-16-4-24 0v28c8-4 16-4 24 0V20z' fill='%23fff' stroke='%2314171A' stroke-width='3'/%3E%3Cpath d='M32 6L58 15L32 24L6 15L32 6Z' fill='%231F8FE0' stroke='%2314171A' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF6FD;
    --card:#FFFFFF;
    --border:#BFE1F7;
    --border-soft:#D7ECFB;
    --ink:#14171A;
    --ink-soft:#5B6672;
    --brown:#7A4A24;
    --blue:#1F8FE0;
    --success:#2E9E5B;
    --success-bg:#E7F6ED;
    --danger:#D64545;
    --danger-bg:#FCEAEA;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,23,26,.06), 0 6px 18px rgba(20,60,90,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 12% 15%, rgba(255,255,255,.7) 0, transparent 38%),
      radial-gradient(circle at 88% 8%, rgba(31,143,224,.14) 0, transparent 40%),
      radial-gradient(circle at 92% 82%, rgba(122,74,36,.08) 0, transparent 42%);
    background-attachment:fixed;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:40px;position:relative;}
  @media (min-width:760px){ #app{max-width:640px;} }

  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}

  /* ---------- buttons ---------- */
  .btn{
    border-radius:999px;border:1.5px solid transparent;padding:11px 18px;
    font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--border);}
  .btn-brown{background:var(--brown);color:#fff;}
  .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger-bg);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px;font-size:.82rem;border-radius:999px;}
  .icon-btn{
    width:38px;height:38px;border-radius:999px;border:1.5px solid var(--border);
    background:#fff;display:flex;align-items:center;justify-content:center;
  }
  .icon-btn svg{width:18px;height:18px;}

  /* ---------- header / nav ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:14px 16px;position:sticky;top:0;background:rgba(234,246,253,.9);
    backdrop-filter:blur(6px);z-index:20;border-bottom:1px solid var(--border-soft);
  }
  .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .topbar-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.05rem;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

  /* ---------- landing hero ---------- */
  .hero{padding:40px 22px 24px;text-align:center;}
  .hero-logo{margin:0 auto 18px;width:76px;height:76px;}
  .hero-title{
    font-family:'Baloo 2',sans-serif;font-weight:800;
    font-size:clamp(2rem,8vw,2.7rem);line-height:1.08;margin:0 0 14px;
  }
  .letter{
    display:inline-block;opacity:0;transform:translateY(16px) scale(.5);
    animation:pop-in .55s cubic-bezier(.34,1.56,.64,1) forwards;
    text-shadow:2px 2px 0 rgba(20,23,26,.14);
  }
  .word-welcome .letter{color:var(--brown);}
  .word-brand .letter{color:var(--blue);}
  @keyframes pop-in{
    0%{opacity:0;transform:translateY(16px) scale(.5);}
    65%{opacity:1;transform:translateY(-4px) scale(1.14);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .letter{animation:none;opacity:1;transform:none;}
  }
  .hero-tag{color:var(--ink-soft);font-size:1rem;max-width:340px;margin:0 auto;line-height:1.5;}

  /* ---------- auth card ---------- */
  .auth-wrap{padding:6px 20px 40px;}
  .tabs{display:flex;background:#fff;border:1.5px solid var(--border);border-radius:999px;padding:4px;margin:22px 0 18px;}
  .tab{flex:1;text-align:center;padding:10px 0;border-radius:999px;font-weight:700;
    font-size:.92rem;color:var(--ink-soft);border:none;background:transparent;}
  .tab.active{background:var(--blue);color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.82rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .field input{
    width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-size:.95rem;background:#fff;color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}
  .hint{font-size:.76rem;color:var(--ink-soft);margin-top:5px;}
  .error-text{font-size:.82rem;color:var(--danger);margin:-6px 0 12px;}
  .footnote{text-align:center;color:var(--ink-soft);font-size:.78rem;margin-top:26px;}

  /* ---------- cards / home ---------- */
  .section-title{font-weight:800;font-size:1.05rem;margin:18px 16px 10px;}
  .empty-state{margin:30px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state svg{width:56px;height:56px;margin-bottom:10px;opacity:.8;}
  .doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px;}
  @media (min-width:520px){ .doc-grid{grid-template-columns:1fr 1fr 1fr;} }
  .doc-card{
    background:var(--card);border:1.5px solid var(--border-soft);border-radius:var(--radius);
    padding:14px;text-align:left;position:relative;display:flex;flex-direction:column;gap:8px;
    min-height:132px;
  }
  .doc-card .badge{
    position:absolute;top:-9px;right:10px;background:var(--brown);color:#fff;
    font-size:.65rem;font-weight:800;padding:3px 9px;border-radius:999px;
  }
  .doc-icon{width:30px;height:30px;color:var(--blue);}
  .doc-title{font-weight:700;font-size:.92rem;line-height:1.25;}
  .doc-meta{font-size:.74rem;color:var(--ink-soft);margin-top:auto;}

  /* ---------- profile ---------- */
  .profile-card{margin:18px 16px;background:#fff;border:1.5px solid var(--border-soft);
    border-radius:var(--radius);padding:20px;}
  .avatar{
    width:64px;height:64px;border-radius:999px;background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;
    font-weight:700;font-size:1.4rem;margin:0 auto 12px;
  }
  .security-list{margin:14px 16px 0;background:#fff;border:1.5px solid var(--border-soft);
    border-radius:var(--radius);padding:14px 16px;}
  .security-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border-soft);font-size:.82rem;}
  .security-item:last-child{border-bottom:none;}
  .security-item .dot{width:8px;height:8px;border-radius:999px;background:var(--success);margin-top:5px;flex-shrink:0;}
  .muted-note{font-size:.76rem;color:var(--ink-soft);line-height:1.5;margin-top:10px;}

  /* ---------- reader ---------- */
  .reader-actions{display:flex;gap:6px;}
  .pager-frame{overflow:hidden;margin:14px 16px;border:1.5px solid var(--border-soft);
    border-radius:var(--radius);background:#fff;}
  .pager-track{display:flex;transition:transform .35s cubic-bezier(.4,0,.2,1);}
  .page{min-width:100%;box-sizing:border-box;padding:26px 22px;min-height:260px;
    font-size:.96rem;line-height:1.65;white-space:pre-wrap;}
  .page img{max-width:100%;border-radius:8px;}
  .page-filecard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:20px;}
  .page-filecard svg{width:48px;height:48px;color:var(--blue);}
  .pager-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px;}
  .pager-nav span{font-size:.8rem;color:var(--ink-soft);font-weight:700;}

  /* quiz */
  .quiz-panel{margin:0 16px 16px;}
  .quiz-toggle{
    width:100%;text-align:left;background:#fff;border:1.5px solid var(--border-soft);
    border-radius:var(--radius);padding:13px 16px;font-weight:800;font-size:.92rem;
    display:flex;align-items:center;justify-content:space-between;
  }
  .quiz-body{background:#fff;border:1.5px solid var(--border-soft);border-top:none;
    border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius);
    margin-top:-8px;padding-top:8px;}
  .quiz-q{border-top:1px dashed var(--border-soft);padding:12px 16px;}
  .quiz-q-head{font-weight:700;font-size:.88rem;display:flex;justify-content:space-between;gap:8px;}
  .quiz-opt{font-size:.84rem;padding:7px 10px;border-radius:8px;margin-top:6px;background:#F5FAFE;}
  .quiz-opt.correct{background:var(--success-bg);color:var(--success);font-weight:700;}
  .quiz-explain{font-size:.8rem;color:var(--ink-soft);margin-top:8px;}
  .spinner-line{display:flex;align-items:center;gap:8px;padding:16px;color:var(--ink-soft);font-size:.86rem;}
  .spin{width:16px;height:16px;border:2.5px solid var(--border);border-top-color:var(--blue);
    border-radius:999px;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,23,26,.42);display:flex;
    align-items:flex-end;justify-content:center;z-index:100;}
  @media (min-width:520px){ .modal-overlay{align-items:center;} }
  .modal{background:#fff;border-radius:20px 20px 0 0;padding:22px 20px 26px;width:100%;
    max-width:440px;max-height:88vh;overflow-y:auto;}
  @media (min-width:520px){ .modal{border-radius:20px;} }
  .modal h3{margin:0 0 4px;font-family:'Baloo 2',sans-serif;font-size:1.15rem;}
  .modal .sub{color:var(--ink-soft);font-size:.84rem;margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .amount-box{background:#F5FAFE;border-radius:var(--radius-sm);padding:14px;text-align:center;margin-bottom:14px;}
  .amount-box .big{font-family:'Baloo 2',sans-serif;font-size:1.5rem;color:var(--blue);}
  .demo-note{font-size:.74rem;color:var(--brown);background:#FBF2E9;border-radius:8px;padding:8px 10px;margin-top:12px;}
  .filedrop{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:20px;text-align:center;color:var(--ink-soft);}
  .filedrop input{margin-top:10px;}
  .scan-line{display:flex;align-items:center;gap:8px;font-size:.85rem;margin-top:12px;color:var(--ink-soft);}
  .scan-line.ok{color:var(--success);font-weight:700;}

  /* ---------- search ---------- */
  .search-wrap{padding:14px 16px 4px;}
  .search-box{position:relative;}
  .search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-soft);}
  .search-box input{width:100%;padding:11px 14px 11px 38px;border:1.5px solid var(--border);
    border-radius:999px;font-size:.92rem;background:#fff;color:var(--ink);}
  .search-box input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}

  /* ---------- doc card + menu ---------- */
  .doc-card-wrap{display:flex;flex-direction:column;gap:6px;}
  .doc-card{transition:background .15s ease, border-color .15s ease, transform .15s ease;}
  .doc-card.doc-selected{background:var(--brown) !important;border-color:var(--brown) !important;transform:scale(.97);}
  .doc-card.doc-selected .doc-title,
  .doc-card.doc-selected .doc-meta,
  .doc-card.doc-selected .doc-icon{color:#fff !important;}
  .doc-card-menu-wrap{position:relative;display:flex;justify-content:center;}
  .dots-btn{background:transparent;border:none;color:var(--ink-soft);font-weight:900;
    letter-spacing:2px;padding:3px 12px;border-radius:8px;font-size:.85rem;}
  .dots-btn:hover{background:#F0F8FE;}
  .dots-menu{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
    background:#fff;border:1.5px solid var(--border-soft);border-radius:12px;box-shadow:var(--shadow);
    overflow:hidden;z-index:15;min-width:160px;}
  .dots-menu button{display:block;width:100%;text-align:left;padding:11px 14px;font-size:.85rem;
    background:#fff;border:none;border-bottom:1px solid var(--border-soft);color:var(--ink);}
  .dots-menu button:last-child{border-bottom:none;}
  .dots-menu button:hover{background:#F5FAFE;}
  .dots-menu button.danger{color:var(--danger);}

  /* ---------- curriculum guide ---------- */
  .curric-section{margin:26px 16px 10px;}
  .curric-tabs{display:flex;gap:8px;margin-bottom:12px;}
  .curric-tab{padding:8px 16px;border-radius:999px;border:1.5px solid var(--border);
    background:#fff;font-weight:700;font-size:.82rem;color:var(--ink-soft);}
  .curric-tab.active{background:var(--brown);border-color:var(--brown);color:#fff;}
  .curric-level{background:#fff;border:1.5px solid var(--border-soft);border-radius:var(--radius);
    margin-bottom:10px;overflow:hidden;}
  .curric-level-head{width:100%;text-align:left;padding:13px 16px;background:#fff;border:none;
    display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.88rem;}
  .curric-level-head .yrs{font-weight:600;color:var(--ink-soft);font-size:.76rem;}
  .curric-level-body{padding:0 16px 14px;font-size:.83rem;color:var(--ink-soft);line-height:1.6;border-top:1px dashed var(--border-soft);padding-top:10px;}
  .curric-source{font-size:.74rem;color:var(--ink-soft);margin-top:10px;line-height:1.5;}
  .curric-source a{color:var(--blue);font-weight:700;text-decoration:none;}

  /* ---------- blur / rate-limit ---------- */
  .pager-frame-wrap{position:relative;}
  .pager-frame.blurred .pager-track{filter:blur(7px);pointer-events:none;user-select:none;}
  .blur-notice{position:absolute;inset:14px 16px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:10px;padding:16px;
    background:rgba(255,255,255,.88);border-radius:var(--radius);border:1.5px solid var(--border-soft);}
  .blur-notice p{margin:0;font-size:.85rem;color:var(--ink-soft);max-width:280px;}

  /* ---------- footer / legal ---------- */
  .site-footer{margin:34px 16px 10px;padding-top:16px;border-top:1px solid var(--border-soft);
    text-align:center;color:var(--ink-soft);font-size:.76rem;line-height:1.9;}
  .site-footer button{background:none;border:none;color:var(--blue);font-weight:700;font-size:.76rem;padding:0 4px;}
  .legal-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .legal-tab{padding:7px 14px;border-radius:999px;border:1.5px solid var(--border);background:#fff;
    font-weight:700;font-size:.78rem;color:var(--ink-soft);}
  .legal-tab.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .legal-body{font-size:.85rem;line-height:1.7;color:var(--ink-soft);max-height:46vh;overflow-y:auto;}
  .legal-body h4{color:var(--ink);margin:14px 0 4px;}
  .legal-body h4:first-child{margin-top:0;}
  .consent-note{font-size:.76rem;color:var(--ink-soft);text-align:center;margin-top:10px;line-height:1.5;}
  .consent-note button{background:none;border:none;color:var(--blue);font-weight:700;font-size:.76rem;padding:0;}

  /* ---------- toast ---------- */
  #toastWrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;
    display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:420px;}
  .toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:.86rem;
    box-shadow:var(--shadow);animation:toast-in .25s ease;}
  .toast.error{background:var(--danger);}
  .toast.success{background:var(--success);}
  @keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="toastWrap"></div>
<div id="app"></div>

<script>
/* =========================================================================
   STUDYHUB — prototype
   Storage: window.storage (personal, non-shared) — private to whoever is
   using this artifact. Everything here is a front-end simulation of
   features that would need a real backend in production; see in-app notes.
   ========================================================================= */

const STORAGE_KEY = 'studyhub-app-data';
const OWNER_EMAIL_FOR_ALERTS = 'annritagatwiri0@gmail.com'; // notification target (see Security note in Profile)
const MAX_STORED_FILE_BYTES = 1.5 * 1024 * 1024; // prototype storage ceiling per file

let appData = { users:{}, session:null, docs:[], library:[], securityLog:[] };
let currentView = 'landing';
let currentParams = {};
let viewStack = [];
let authTab = 'signin';
let authError = '';
let readerPage = 0;
let quizState = {}; // docId -> {status, questions}
let quizOpenFor = null;
let pendingUpload = null; // {file, dataUrl/text, kind}
let uploadStep = 'pick'; // pick | scanning | done
let downloadModal = null; // {docId, step, phone}
let docSearchQuery = '';
let docMenuOpenFor = null;
let curricTab = 'cbc';
let curricOpenLevel = null;
let legalTab = 'terms';
const unblurredDocs = new Set(); // session-only overrides for the rate-limit blur
const VIEW_RATE_LIMIT = 4;       // opens allowed within the trailing hour before blurring
const VIEW_RATE_WINDOW_MS = 60 * 60 * 1000;

/* ---------------- curriculum reference data ----------------
   Structure/timeline only (not copied notes) — verified via web search
   Sept 2026. Sources linked in the UI for the full official detail. */
const CURRICULUM = {
  cbc: {
    label: 'CBC (current)',
    intro: 'Kenya\u2019s Competency-Based Curriculum follows a 2\u20116\u20113\u20113\u20113 structure: 2 years pre-primary, 6 years primary, 3 years junior school, 3 years senior school, then tertiary education.',
    levels: [
      { name:'Pre-Primary', years:'PP1\u2013PP2', subjects:'Language activities, Mathematical activities, Environmental activities, Psychomotor & Creative activities, Religious Education.' },
      { name:'Lower Primary', years:'Grade 1\u20133', subjects:'English, Kiswahili/Kenyan Sign Language, Mathematics, Environmental Activities, Religious Education, Creative Arts, Physical & Health Education.' },
      { name:'Upper Primary', years:'Grade 4\u20136', subjects:'English, Kiswahili/KSL, Mathematics, Science & Technology, Social Studies, Religious Education, Agriculture & Nutrition, Creative Arts, PE. Ends with the KPSEA assessment.' },
      { name:'Junior School', years:'Grade 7\u20139', subjects:'English, Kiswahili/KSL, Mathematics, Integrated Science, Pre-Technical Studies, Social Studies, Religious Education, Business Studies, Agriculture, Life Skills, Sports & PE. Ends with KJSEA, used for Senior School placement.' },
      { name:'Senior School', years:'Grade 10\u201312', subjects:'One pathway \u2014 STEM, Social Sciences, or Arts & Sports Science \u2014 plus core English, Kiswahili/KSL, Community Service Learning and PE. First cohort entered Grade 10 in January 2026.' },
      { name:'Tertiary', years:'University / TVET', subjects:'Degree, diploma or TVET programmes aligned to the learner\u2019s senior-school pathway.' }
    ],
    sourceNote: 'Structure confirmed against reporting from September 2026 on KICD/KNEC\u2019s CBC rollout.'
  },
  '844': {
    label: '8-4-4 (legacy)',
    intro: 'The older 8-4-4 system is being phased out as CBC replaces it, but existing 8-4-4 cohorts are still finishing school under it, so KCSE is still being registered alongside CBC.',
    levels: [
      { name:'Primary', years:'Standard 1\u20138', subjects:'English, Kiswahili, Mathematics, Science, Social Studies, CRE/IRE, Creative Arts, Physical Education. Ends with KCPE.' },
      { name:'Secondary', years:'Form 1\u20134', subjects:'Compulsory English, Kiswahili, Mathematics, Biology, Chemistry, Physics, History & Government, Geography, CRE/IRE/HRE, plus electives such as Business Studies, Agriculture, Computer Studies, Home Science or French. Ends with KCSE.' },
      { name:'University', years:'~4 years', subjects:'Bachelor\u2019s degree programmes, following on from KCSE subject and grade requirements.' }
    ],
    sourceNote: 'Kenya is currently running 8-4-4 and CBC/CBE side by side during the transition period.'
  }
};

/* ---------------- storage ----------------
   Uses window.storage when previewed inside Claude.ai (syncs to your account).
   Falls back to the browser's own localStorage when this file is hosted as a
   real, standalone website — that's what makes it work outside Claude.ai. */
const hasCloudStorage = (typeof window.storage !== 'undefined');

async function rawGet(key){
  if(hasCloudStorage){
    try{ return await window.storage.get(key); }catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem(key);
    return v==null ? null : { key, value:v };
  }catch(e){ return null; }
}
async function rawSet(key, value){
  if(hasCloudStorage){
    try{ return await window.storage.set(key, value); }catch(e){ return null; }
  }
  try{ localStorage.setItem(key, value); return { key, value }; }
  catch(e){ return null; }
}
async function loadData(){
  try{
    const res = await rawGet(STORAGE_KEY);
    if(res && res.value) appData = JSON.parse(res.value);
  }catch(e){ /* no data yet — defaults stand */ }
}
async function saveData(){
  const res = await rawSet(STORAGE_KEY, JSON.stringify(appData));
  if(!res) showToast('Could not save changes — storage error.', 'error');
}
function log(message){
  appData.securityLog.unshift({ ts: Date.now(), message });
  appData.securityLog = appData.securityLog.slice(0, 20);
}

/* ---------------- toast ---------------- */
function showToast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' '+type : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2600);
}

/* ---------------- navigation ---------------- */
function goTo(view, params, replace){
  if(!replace) viewStack.push({view: currentView, params: currentParams});
  currentView = view; currentParams = params || {};
  try{ history.pushState({view, params: currentParams}, '', '#'+view); }catch(e){}
  render();
  window.scrollTo(0,0);
}
function goBack(){
  if(viewStack.length === 0){ return; }
  const prev = viewStack.pop();
  currentView = prev.view; currentParams = prev.params;
  render();
  window.scrollTo(0,0);
}
document.addEventListener('keydown', (e)=>{
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA';
  const modalOpen = !!document.getElementById('modalOverlay');

  if(e.key === 'Escape' && modalOpen){ closeModal(); return; }
  if(modalOpen) return;

  if(currentView === 'reader' && !typing){
    if(e.key === 'ArrowLeft'){ pageStep(-1); }
    if(e.key === 'ArrowRight'){ pageStep(1); }
  }
  if(currentView === 'home' && e.key === '/' && !typing){
    e.preventDefault();
    const input = document.getElementById('docSearchInput');
    if(input) input.focus();
  }
});
window.addEventListener('popstate', ()=>{
  if(viewStack.length > 0){
    const prev = viewStack.pop();
    currentView = prev.view; currentParams = prev.params;
    render();
  }
});

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name, email){
  const src = (name||email||'?').trim();
  const parts = src.split(/\s+/);
  if(parts.length>1) return (parts[0][0]+parts[1][0]).toUpperCase();
  return src.slice(0,2).toUpperCase();
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function currentUser(){
  if(!appData.session) return null;
  return appData.users[appData.session] || null;
}
function isAdminUser(){
  const u = currentUser();
  return !!(u && u.isAdmin);
}

async function submitAuth(){
  const email = (document.getElementById('fEmail').value||'').trim().toLowerCase();
  const pass = document.getElementById('fPass').value||'';
  authError = '';
  if(!email || !pass || pass.length<6){ authError = 'Enter a valid email and a password of at least 6 characters.'; render(); return; }

  if(authTab === 'signup'){
    const name = (document.getElementById('fName').value||'').trim();
    if(!name){ authError = 'Tell us your name for your profile.'; render(); return; }
    if(appData.users[email]){ authError = 'An account with that email already exists — try signing in instead.'; render(); return; }
    const isFirstEver = Object.keys(appData.users).length === 0;
    appData.users[email] = { email, password: pass, name, bio:'', isAdmin:isFirstEver, createdAt: Date.now() };
    appData.session = email;
    log(`Account created for ${email}.`);
  } else {
    const u = appData.users[email];
    if(!u || u.password !== pass){
      log(`Failed sign-in attempt for ${email}.`);
      authError = 'That email and password don\u2019t match our records.';
      render(); return;
    }
    appData.session = email;
    log(`${email} signed in.`);
  }
  await saveData();
  viewStack = [];
  authError = '';
  showToast(authTab==='signup' ? 'Account created — welcome!' : 'Signed in — welcome back!', 'success');
  if(appData.docs.length > 0){
    openReader(appData.docs[0].id, true);
  } else {
    goTo('home', {}, true);
  }
}

function logout(){
  log(`${appData.session} signed out.`);
  appData.session = null;
  saveData();
  viewStack = [];
  goTo('landing', {}, true);
}

/* ============================================================
   READER
   ============================================================ */
function findDoc(id){ return appData.docs.find(d => d.id === id); }

function openReader(id, replace){
  readerPage = 0;
  quizOpenFor = null;
  const doc = findDoc(id);
  if(doc){
    doc.viewLog = (doc.viewLog || []).filter(t => Date.now()-t < VIEW_RATE_WINDOW_MS);
    doc.viewLog.push(Date.now());
    saveData();
  }
  goTo('reader', {docId:id}, replace);
}
function recentViewCount(doc){
  return (doc.viewLog || []).filter(t => Date.now()-t < VIEW_RATE_WINDOW_MS).length;
}
function unblurTemp(id){
  unblurredDocs.add(id);
  render();
}

function renderReader(){
  const doc = findDoc(currentParams.docId);
  if(!doc){ return renderTopbar({title:'Not found', showBack:true}) + `<div class="empty-state">This document isn't available.</div>`; }
  if(readerPage >= doc.pages.length) readerPage = doc.pages.length-1;
  if(readerPage < 0) readerPage = 0;
  const isSaved = appData.library.includes(doc.id);

  const right = `
    <button class="icon-btn" onclick="toggleSave('${doc.id}')" aria-label="Save">${ICONS.bookmark(isSaved)}</button>
    <button class="icon-btn" onclick="openDownloadModal('${doc.id}')" aria-label="Download">${ICONS.download}</button>
  `;

  const pagesHtml = doc.pages.map(p => {
    if(p.type === 'image'){
      return `<div class="page"><img src="${p.content}" alt="${esc(doc.title)}"></div>`;
    }
    if(p.type === 'file'){
      return `<div class="page page-filecard">${ICONS.fileGeneric}<div style="font-weight:700">${esc(doc.fileName||doc.title)}</div>
        <div style="color:var(--ink-soft);font-size:.84rem;">Preview isn't available for this file type in the prototype.<br>Use Download to get the full file.</div></div>`;
    }
    return `<div class="page">${esc(p.content)}</div>`;
  }).join('');

  const isBlurred = recentViewCount(doc) > VIEW_RATE_LIMIT && !unblurredDocs.has(doc.id);

  return renderTopbar({title: doc.title, showBack:true, right}) + `
    <div class="pager-frame-wrap">
      <div class="pager-frame ${isBlurred?'blurred':''}">
        <div class="pager-track" id="pagerTrack" style="transform:translateX(-${readerPage*100}%)">${pagesHtml}</div>
      </div>
      ${isBlurred ? `<div class="blur-notice">
        <p>You've opened this document several times in the last hour, so pages are blurred to limit copying. All pages are still yours to read.</p>
        <button class="btn btn-primary btn-sm" onclick="unblurTemp('${doc.id}')">View anyway</button>
      </div>` : ''}
    </div>
    <div class="pager-nav">
      <button class="btn btn-ghost btn-sm" onclick="pageStep(-1)" ${readerPage===0?'disabled':''}>\u2039 Prev</button>
      <span>Page ${readerPage+1} of ${doc.pages.length}</span>
      <button class="btn btn-ghost btn-sm" onclick="pageStep(1)" ${readerPage===doc.pages.length-1?'disabled':''}>Next \u203a</button>
    </div>
    <div class="quiz-panel">
      <button class="quiz-toggle" onclick="toggleQuiz('${doc.id}')">Quiz <span>\u2192</span></button>
      ${quizOpenFor===doc.id ? renderQuizBody(doc) : ''}
    </div>
    ${renderFooter()}
  `;
}
function pageStep(dir){
  const doc = findDoc(currentParams.docId);
  if(!doc) return;
  readerPage = Math.max(0, Math.min(doc.pages.length-1, readerPage+dir));
  render();
}
let touchStartX = null;
document.addEventListener('touchstart', e=>{ if(currentView==='reader') touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', e=>{
  if(currentView==='reader' && touchStartX!=null){
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 50) pageStep(dx < 0 ? 1 : -1);
    touchStartX = null;
  }
});

/* ---------------- quiz ---------------- */
function toggleQuiz(id){
  quizOpenFor = quizOpenFor === id ? null : id;
  render();
  if(quizOpenFor === id && !quizState[id]){
    generateQuiz(id);
  }
}
function renderQuizBody(doc){
  const st = quizState[doc.id];
  if(!st || st.status === 'loading'){
    return `<div class="quiz-body"><div class="spinner-line"><div class="spin"></div> Finding good questions on this topic\u2026</div></div>`;
  }
  const fallbackNote = st.source === 'fallback'
    ? `<div style="padding:10px 16px 0;font-size:.76rem;color:var(--ink-soft);">Basic practice questions built from your notes directly \u2014 open this inside Claude.ai for richer, AI-written questions with web search.</div>`
    : '';
  return `<div class="quiz-body">${fallbackNote}${st.questions.map((q,i)=>`
    <div class="quiz-q">
      <div class="quiz-q-head"><span>${i+1}. ${esc(q.question)}</span></div>
      ${q.options.map((opt,oi)=>`<div class="quiz-opt ${oi===q.answerIndex?'correct':''}">${esc(opt)}</div>`).join('')}
      ${q.explanation ? `<div class="quiz-explain">${esc(q.explanation)}</div>` : ''}
    </div>
  `).join('')}</div>`;
}
function shuffleArr(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

// Guaranteed-to-work fallback: builds a quiz straight from the document's own
// text with no network needed at all, so the quiz always produces *something*
// even outside Claude.ai, offline, or if the AI call fails for any reason.
function localFallbackQuiz(doc){
  const text = doc.pages.filter(p=>p.type==='text').map(p=>p.content).join(' ');
  let sentences = text.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>25 && s.length<180);
  sentences = [...new Set(sentences)];
  const genericDistractors = [
    'This point does not appear anywhere in these notes.',
    'This is unrelated to the topic covered in this document.',
    'This statement contradicts what these notes actually say.',
    'This detail belongs to a completely different subject.',
    'This was added by mistake and isn\u2019t part of the notes.',
    'This claim isn\u2019t supported anywhere in the uploaded document.'
  ];
  const picked = shuffleArr(sentences).slice(0, Math.min(4, sentences.length || 0));
  if(picked.length === 0){
    return [{
      question: `What is the document "${doc.title}" about?`,
      options: shuffleArr([doc.title, 'An unrelated topic', 'A blank page', 'Nothing in particular']),
      answerIndex: 0,
      explanation: 'Based on the document\u2019s title — upload a text-based document for richer, content-based questions.'
    }];
  }
  return picked.map(correct => {
    const wrongs = shuffleArr(genericDistractors).slice(0,3);
    const options = shuffleArr([correct, ...wrongs]);
    return {
      question: `Which statement below is taken directly from "${doc.title}"?`,
      options,
      answerIndex: options.indexOf(correct),
      explanation: 'This sentence appears verbatim in your uploaded notes.'
    };
  });
}

async function generateQuiz(id){
  const doc = findDoc(id);
  if(!doc) return;
  quizState[id] = { status:'loading', questions:[], source:null };
  render();

  const example = appData.docs.find(d => d.isExample && d.id !== id);
  const excerptOf = d => (d.pages.filter(p=>p.type==='text').map(p=>p.content).join(' ') || d.title).slice(0, 900);

  const prompt = `You are helping generate a short practice quiz for a study-notes app called StudyHub.
Document title: "${doc.title}"
Document excerpt: """${excerptOf(doc)}"""
${example ? `For reference, here is an excerpt from the app's example document showing the general style of notes on this platform: """${excerptOf(example)}"""` : ''}

Write 4 multiple-choice questions that test understanding of the document's topic. You may use web search to check accuracy or find commonly-asked exam questions on this exact topic.
Respond with ONLY valid JSON, no markdown fences, no commentary, in exactly this shape:
{"questions":[{"question":"...","options":["...","...","...","..."],"answerIndex":0,"explanation":"..."}]}`;

  try{
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 15000);
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      signal: controller.signal,
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1200,
        messages:[{role:'user', content: prompt}],
        tools:[{type:'web_search_20250305', name:'web_search'}]
      })
    });
    clearTimeout(timeout);
    if(!res.ok) throw new Error('bad status ' + res.status);
    const data = await res.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    const start = textBlocks.indexOf('{');
    const end = textBlocks.lastIndexOf('}');
    if(start===-1 || end===-1) throw new Error('no json in response');
    const parsed = JSON.parse(textBlocks.slice(start, end+1));
    if(!parsed.questions || !parsed.questions.length) throw new Error('empty questions');
    quizState[id] = { status:'done', questions: parsed.questions, source:'ai' };
  }catch(e){
    console.warn('AI quiz unavailable, using offline fallback quiz:', e);
    quizState[id] = { status:'done', questions: localFallbackQuiz(doc), source:'fallback' };
  }
  if(quizOpenFor === id) render();
}

function openUploadModal(){
  pendingUpload = null;
  uploadStep = 'pick';
  renderModal(uploadModalHtml());
}
function refreshUploadBtn(){
  const btn = document.getElementById('confirmUploadBtn');
  const check = document.getElementById('uploadRightsCheck');
  if(btn) btn.disabled = !(pendingUpload && check && check.checked);
}
function uploadModalHtml(){
  if(uploadStep === 'pick'){
    return `<h3>Upload a document</h3>
      <p class="sub">Any file type. ${appData.docs.length===0 ? 'This first one becomes your example document.' : ''}</p>
      <form onsubmit="event.preventDefault(); confirmUpload();">
      <div class="filedrop">
        ${ICONS.fileGeneric.replaceAll('currentColor','#1F8FE0')}
        <div style="margin-top:6px;">Choose a file from your device</div>
        <input type="file" id="uploadInput" onchange="handleFileSelect(event)">
      </div>
      <div class="field" style="margin-top:14px;">
        <label>Title</label>
        <input id="uploadTitle" type="text" placeholder="e.g. Cell Biology \u2014 Chapter 3">
      </div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:.8rem;color:var(--ink-soft);margin-top:12px;">
        <input type="checkbox" id="uploadRightsCheck" onchange="refreshUploadBtn()" style="margin-top:2px;">
        <span>I confirm this is my own document, or I have the right to share it here.</span>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="confirmUploadBtn" disabled>Upload</button>
      </div>
      </form>`;
  }
  if(uploadStep === 'scanning'){
    return `<h3>Uploading\u2026</h3>
      <div class="scan-line"><div class="spin"></div> Scanning for viruses\u2026</div>`;
  }
  return `<h3>All set</h3>
    <div class="scan-line ok">\u2705 No threats found \u2014 document saved.</div>`;
}
function handleFileSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  const titleInput = document.getElementById('uploadTitle');
  if(titleInput && !titleInput.value) titleInput.value = file.name.replace(/\.[^.]+$/, '');

  const finish = (payload)=>{
    pendingUpload = { file, ...payload };
    refreshUploadBtn();
  };

  if(file.size > MAX_STORED_FILE_BYTES){
    finish({ kind:'file', dataUrl:null, tooLarge:true });
    return;
  }
  if(file.type.startsWith('image/')){
    const r = new FileReader();
    r.onload = ()=> finish({ kind:'image', dataUrl:r.result });
    r.readAsDataURL(file);
  } else if(file.type.startsWith('text/') || /\.(txt|md|csv|json)$/i.test(file.name)){
    const r = new FileReader();
    r.onload = ()=> finish({ kind:'text', text:r.result, dataUrl:null });
    r.onerror = ()=> finish({ kind:'file', dataUrl:null });
    r.readAsText(file);
  } else {
    const r = new FileReader();
    r.onload = ()=> finish({ kind:'file', dataUrl:r.result });
    r.onerror = ()=> finish({ kind:'file', dataUrl:null });
    r.readAsDataURL(file);
  }
}
function paginateText(text, size){
  size = size || 650;
  const words = (text||'').split(/\s+/).filter(Boolean);
  const pages = []; let cur = '';
  for(const w of words){
    if((cur + ' ' + w).trim().length > size){ pages.push(cur.trim()); cur = w; }
    else { cur = (cur + ' ' + w).trim(); }
  }
  if(cur) pages.push(cur);
  return pages.length ? pages : ['(This document appears to be empty.)'];
}
async function confirmUpload(){
  if(!pendingUpload) return;
  const title = (document.getElementById('uploadTitle')?.value || pendingUpload.file.name).trim() || pendingUpload.file.name;
  uploadStep = 'scanning';
  renderModal(uploadModalHtml());
  await new Promise(r=>setTimeout(r, 1100));

  const isExample = appData.docs.length === 0;
  let pages, fileDataUrl = null;

  if(pendingUpload.kind === 'text'){
    pages = paginateText(pendingUpload.text).map(t => ({type:'text', content:t}));
  } else if(pendingUpload.kind === 'image'){
    pages = [{type:'image', content: pendingUpload.dataUrl}];
    fileDataUrl = pendingUpload.dataUrl;
  } else {
    pages = [{type:'file'}];
    fileDataUrl = pendingUpload.dataUrl || null;
  }

  const doc = {
    id: 'd' + Date.now(),
    title, isExample, pages,
    fileName: pendingUpload.file.name,
    fileDataUrl,
    previewUnavailable: pendingUpload.tooLarge || false,
    uploadedAt: Date.now()
  };
  appData.docs.unshift(doc);
  if(isExample){
    // keep the example first in the list regardless of later uploads
    appData.docs.sort((a,b)=> (b.isExample?1:0) - (a.isExample?1:0));
  }
  log(`Uploaded "${title}" \u2014 scanned, no threats found.`);
  await saveData();

  uploadStep = 'done';
  renderModal(uploadModalHtml());
  await new Promise(r=>setTimeout(r, 700));
  closeModal();
  showToast('Document uploaded.', 'success');
  render();
}

function openDownloadModal(docId){

function downloadModalHtml(){
  const doc = findDoc(downloadModal.docId);

      </div>
      <div class="demo-note">Demo mode: this build doesn't process a real payment or contact Safaricom. A live version would need M-Pesa's business API wired up on a real server.</div>
      <div class="modal-actions">

        <button type="submit" class="btn btn-primary">Agree &amp; pay</button>
      </div>
      </form>`;
  }
  if(downloadModal.step === 'sending'){
    return `<h3>Sending payment prompt\u2026</h3>
      <div class="scan-line"><div class="spin"></div> Sending an STK push to ${esc(downloadModal.phone)}</div>`;
  }
  if(downloadModal.step === 'confirm'){
    return `<h3>Check your phone</h3>
      <p class="sub">Enter your M-Pesa PIN on the prompt sent to ${esc(downloadModal.phone)} to complete the KES 20 payment.</p>
      <div class="demo-note">Simulated for this prototype \u2014 tap below to mimic a completed payment.</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="simulatePaid()">I've paid</button>
      </div>`;
  }
  return `<h3>Payment received \u2705</h3><p class="sub">Your download is starting now.</p>`;
}
function agreeDownload(){
  const phone = (document.getElementById('mpesaPhone').value||'').trim();
  if(!/^(\+?254|0)[71]\d{8}$/.test(phone.replace(/\s+/g,''))){
    showToast('Enter a valid M-Pesa number, e.g. 07XXXXXXXX.', 'error');
    return;
  }
  downloadModal.phone = phone;
  downloadModal.step = 'sending';
  renderModal(downloadModalHtml());
  setTimeout(()=>{ downloadModal.step='confirm'; renderModal(downloadModalHtml()); }, 1100);
}
function simulatePaid(){
  downloadModal.step = 'success';
  renderModal(downloadModalHtml());
  const doc = findDoc(downloadModal.docId);
  log(`Simulated payment of KES 20 for "${doc?doc.title:'a document'}".`);
  saveData();
  setTimeout(()=>{
    triggerDownload(doc);
    closeModal();
    showToast('Downloaded.', 'success');
  }, 900);
}
function triggerDownload(doc){
  if(!doc) return;
  let blob, filename;
  if(doc.fileDataUrl){
    try{
      const [meta, b64] = doc.fileDataUrl.split(',');
      const mimeMatch = meta.match(/data:(.*);base64/);
      const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      blob = new Blob([arr], {type:mime});
      filename = doc.fileName || (doc.title + '.bin');
    }catch(e){
      blob = new Blob([doc.title], {type:'text/plain'});
      filename = doc.title.replace(/[^a-z0-9]+/gi,'_') + '.txt';
    }
  } else {
    const text = doc.pages.filter(p=>p.type==='text').map(p=>p.content).join('\n\n')
      || `${doc.title}\n\n(Original file preview wasn't stored in this prototype.)`;
    blob = new Blob([text], {type:'text/plain'});
    filename = doc.title.replace(/[^a-z0-9]+/gi,'_') + '.txt';
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

/* ============================================================
   MODAL PLUMBING
   ============================================================ */
function renderModal(innerHtml){
  let overlay = document.getElementById('modalOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'modalOverlay';
    overlay.className = 'modal-overlay';
    overlay.onclick = (e)=>{ if(e.target === overlay) closeModal(); };
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `<div class="modal">${innerHtml}</div>`;
}
function closeModal(){
  const overlay = document.getElementById('modalOverlay');
  if(overlay) overlay.remove();
  pendingUpload = null; uploadStep='pick'; downloadModal = null;
}

/* ============================================================
   MASTER RENDER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(currentView){
    case 'splash': html = renderSplash(); break;
    case 'landing': html = renderLanding(); break;
    case 'home': html = renderHome(); break;
    case 'profile': html = renderProfile(); break;
    case 'library': html = renderLibrary(); break;
    case 'reader': html = renderReader(); break;
    default: html = renderLanding();
  }
  app.innerHTML = html;
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  document.getElementById('app').innerHTML = `<div class="empty-state">Loading StudyHub\u2026</div>`;
  await loadData();
  if(appData.session && appData.users[appData.session]){
    currentView = 'splash';
    render();
    setTimeout(()=>{ goTo('home', {}, true); }, 1600);
  } else {
    currentView = 'landing';
    render();
  }
})();
